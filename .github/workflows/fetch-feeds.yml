name: Fetch RSS feeds

on:
  schedule:
    # 2時間ごとに実行(UTC)。
    # update-012: HH:00 は全世界の cron が殺到する混雑帯のため
    # 実測でしばしばスキップ・大幅遅延が発生していた。HH:07 にずらす
    # ことでキューイング遅延を緩和する(GitHub Actions コミュニティの
    # 既知 mitigation: minute 0/15/30/45 を避ける)。
    - cron: "7 */2 * * *"
  workflow_dispatch: # 手動実行を許可
  push:
    branches: [main]
    paths:
      - "opml/subscriptions.opml"
      - "scripts/**"
      - ".github/workflows/fetch-feeds.yml"

permissions:
  contents: write

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    concurrency:
      group: fetch-feeds
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild feeds.json from OPML preserving metadata
        run: |
          # Checkout mtimes do not express Git history. Rebuild deterministically.
          python scripts/opml_to_feeds.py

      - name: Fetch all feeds
        # update-009: feeds.json で `via_worker: true` のフィードは
        # Cloudflare Worker /fetch 経由で取得する。WORKER_TOKEN は
        # Repository Secret として設定する(初期値は SYNC_SECRET と同値)。
        env:
          WORKER_BASE_URL: "https://kk-sync.other9.workers.dev"
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python scripts/fetch_feeds.py

      - name: Commit updated data
        # Never overwrite a concurrent manual data/configuration change.
        # A rejected push fails visibly; the next cron starts from current main
        # and regenerates using the latest subscriptions, metadata and articles.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feeds.json docs/data/articles.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update feeds"
          git push origin HEAD:main
