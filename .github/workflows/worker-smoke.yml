name: Worker smoke
on:
  workflow_dispatch:
    inputs:
      expected_state_sha256:
        description: Optional canonical state fingerprint during paused migration
        required: false
        type: string
      expect_maintenance:
        description: Expect synchronization writes to be paused
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify authenticated Worker behavior
        env:
          WORKER_BASE_URL: https://kk-sync.other9.workers.dev
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECT_MAINTENANCE: ${{ inputs.expect_maintenance }}
        run: python scripts/smoke_worker.py
